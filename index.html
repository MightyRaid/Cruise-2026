<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigator of the Seas | 4D3N Holiday Voyage (17–20 Dec)</title>
  <style>
    :root {
      --deep-ocean: #06283d;
      --lagoon: #0e7490;
      --aqua: #06b6d4;
      --coral: #f97316;
      --coral-soft: #fff7ed;
      --sun: #f59e0b;
      --sun-soft: #fef3c7;
      --sand: #fbf8f3;
      --card: #ffffff;
      --ink: #132a3e;
      --muted: #52687a;
      --border: #e2e8f0;
      --mint-bg: #ecfdf5;
      --mint-ink: #065f46;
      --twilight: #1e1b4b;
      --twilight-bg: #eef2ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 10% 0%, rgba(6, 182, 212, 0.08), transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(249, 115, 22, 0.08), transparent 40%),
        var(--sand);
      color: var(--ink);
      line-height: 1.5;
      padding-bottom: 3.5rem;
    }

    input.nav-state {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    /* Tropical Sunset & Ocean Liner Hero */
    .hero {
      position: relative;
      background:
        radial-gradient(circle at 88% 18%, rgba(249, 115, 22, 0.35), transparent 42%),
        radial-gradient(circle at 15% 80%, rgba(6, 182, 212, 0.3), transparent 50%),
        linear-gradient(145deg, #041f33 0%, #0a4d68 55%, #088395 100%);
      color: #ffffff;
      padding: 2rem 1rem 3.4rem;
      text-align: center;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 24px;
      background: var(--sand);
      border-top-left-radius: 50% 24px;
      border-top-right-radius: 50% 24px;
    }

    .boarding-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fef3c7;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
    }

    .hero h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
    }

    .hero-route {
      font-size: 0.9rem;
      color: #e0f2fe;
      font-weight: 500;
      margin-bottom: 0.95rem;
    }

    .rhythm-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
    }

    .rhythm-pill {
      background: rgba(4, 31, 51, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      padding: 0.25rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: #ffffff;
    }

    .wrap {
      width: 100%;
      max-width: 860px;
      margin: -1.1rem auto 0;
      padding: 0 0.8rem;
      position: relative;
      z-index: 2;
    }

    /* Boarding-Pass Day Selector */
    .deck-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--card);
      border: 1px solid #dbeafe;
      border-radius: 16px;
      padding: 0.35rem;
      gap: 0.25rem;
      box-shadow: 0 10px 25px rgba(6, 40, 61, 0.1);
      margin-bottom: 1.15rem;
    }

    .deck-tab {
      text-align: center;
      padding: 0.58rem 0.2rem;
      border-radius: 11px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      line-height: 1.25;
      transition: all 0.18s ease;
    }

    #dk-1:checked ~ .wrap .deck-tabs label[for="dk-1"],
    #dk-2:checked ~ .wrap .deck-tabs label[for="dk-2"],
    #dk-3:checked ~ .wrap .deck-tabs label[for="dk-3"],
    #dk-4:checked ~ .wrap .deck-tabs label[for="dk-4"],
    #dk-5:checked ~ .wrap .deck-tabs label[for="dk-5"] {
      background: linear-gradient(135deg, var(--lagoon) 0%, var(--deep-ocean) 100%);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(14, 116, 144, 0.3);
    }

    .deck-panel { display: none; }
    #dk-1:checked ~ .wrap #panel-1 { display: block; }
    #dk-2:checked ~ .wrap #panel-2 { display: block; }
    #dk-3:checked ~ .wrap #panel-3 { display: block; }
    #dk-4:checked ~ .wrap #panel-4 { display: block; }
    #dk-5:checked ~ .wrap #panel-5 { display: block; }

    /* Day Header Banner */
    .day-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.05rem 1.15rem;
      margin-bottom: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(6, 40, 61, 0.04);
      border-left: 5px solid var(--coral);
    }

    .day-banner h2 {
      font-size: 1.12rem;
      color: var(--deep-ocean);
      font-weight: 800;
    }

    .port-chip {
      background: var(--coral-soft);
      color: #c2410c;
      border: 1px solid #fed7aa;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
    }

    /* Timeline Slot Cards */
    .slot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 1rem;
      margin-bottom: 0.9rem;
      box-shadow: 0 3px 10px rgba(6, 40, 61, 0.04);
    }

    .slot-card.night-mode {
      background: linear-gradient(180deg, #ffffff 0%, #f5f7ff 100%);
      border-color: #c7d2fe;
    }

    .slot-meta {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.25rem;
    }

    .time-badge {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--lagoon);
      background: #ecfeff;
      border: 1px solid #cffafe;
      padding: 0.16rem 0.55rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .night-mode .time-badge {
      color: #3730a3;
      background: var(--twilight-bg);
      border-color: #c7d2fe;
    }

    .slot-heading {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--deep-ocean);
      margin-bottom: 0.55rem;
    }

    .choice-stack {
      display: flex;
      flex-direction: column;
      gap: 0.42rem;
      margin-bottom: 0.7rem;
    }

      display: flex;
      justify-content: space-between;
      align-
