<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigator of the Seas | 4D3N Singapore – Penang Voyage (17–20 Dec)</title>
  <style>
    :root {
      --hull: #091e36;
      --sea: #0b4f78;
      --lagoon: #137a9c;
      --foam: #eef6fa;
      --brass: #c9973b;
      --brass-light: #f6ebd2;
      --sand: #f4f1ea;
      --card: #ffffff;
      --ink: #162433;
      --muted: #5c6f82;
      --line: #d9e3ec;
      --night: #172554;
      --night-bg: #eef2ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
      background-color: var(--sand);
      color: var(--ink);
      line-height: 1.5;
      padding-bottom: 3rem;
    }

    input.nav-state {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .voyage-header {
      background:
        radial-gradient(circle at 85% 15%, rgba(201, 151, 59, 0.24), transparent 45%),
        linear-gradient(160deg, var(--hull) 0%, var(--sea) 62%, var(--lagoon) 100%);
      color: #ffffff;
      padding: 1.85rem 1rem 2.75rem;
      text-align: center;
      border-bottom: 4px solid var(--brass);
    }

    .voyage-tag {
      display: inline-block;
      background: rgba(201, 151, 59, 0.22);
      border: 1px solid rgba(246, 235, 210, 0.45);
      color: var(--brass-light);
      padding: 0.28rem 0.85rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .voyage-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
    }

    .voyage-sub {
      font-size: 0.88rem;
      color: #dbeaf3;
      max-width: 580px;
      margin: 0 auto;
    }

    .schedule-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.38rem;
      margin-top: 0.95rem;
    }

    .schedule-chip {
      background: rgba(9, 30, 54, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 0.24rem 0.55rem;
      font-size: 0.72rem;
      color: #f8fafc;
    }

    .wrap {
      width: 100%;
      max-width: 840px;
      margin: -1.45rem auto 0;
      padding: 0 0.75rem;
    }

    .deck-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.3rem;
      gap: 0.2rem;
      box-shadow: 0 6px 16px rgba(9, 30, 54, 0.1);
      margin-bottom: 1.05rem;
    }

    .deck-tab {
      text-align: center;
      padding: 0.55rem 0.2rem;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      line-height: 1.25;
      transition: background 0.15s, color 0.15s;
    }

    #dk-1:checked ~ .wrap .deck-tabs label[for="dk-1"],
    #dk-2:checked ~ .wrap .deck-tabs label[for="dk-2"],
    #dk-3:checked ~ .wrap .deck-tabs label[for="dk-3"],
    #dk-4:checked ~ .wrap .deck-tabs label[for="dk-4"],
    #dk-5:checked ~ .wrap .deck-tabs label[for="dk-5"] {
      background: var(--hull);
      color: #ffffff;
      box-shadow: inset 0 -2px 0 var(--brass);
    }

    .deck-panel { display: none; }
    #dk-1:checked ~ .wrap #panel-1 { display: block; }
    #dk-2:checked ~ .wrap #panel-2 { display: block; }
    #dk-3:checked ~ .wrap #panel-3 { display: block; }
    #dk-4:checked ~ .wrap #panel-4 { display: block; }
    #dk-5:checked ~ .wrap #panel-5 { display: block; }

    .log-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.05rem;
      margin-bottom: 1rem;
      box-shadow: 0 3px 10px rgba(9, 30, 54, 0.05);
    }

    .log-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.45rem;
      padding-bottom: 0.65rem;
      margin-bottom: 0.9rem;
      border-bottom: 2px solid var(--foam);
    }

    .log-head h2 {
      font-size: 1.08rem;
      color: var(--hull);
    }

    .port-pill {
      background: var(--brass-light);
      color: #7c530c;
      border: 1px solid #e7cf9b;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
    }

    .itinerary-block {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 0.9rem;
      margin-bottom: 0.85rem;
      background: #fbfcfd;
    }

    .itinerary-block.late-night {
      background: #f8faff;
      border-color: #c7d2fe;
    }

    .itinerary-block:last-child { margin-bottom: 0; }

    .time-stamp {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--lagoon);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.2rem;
    }

    .late-night .time-stamp {
      color: #3730a3;
    }

    .block-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--hull);
      margin-bottom: 0.45rem;
    }

    .choice-stack {
      display: flex;
      flex-direction: column;
      gap: 0.42rem;
      margin: 0.55rem 0 0.7rem;
    }

    .choice-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0.58rem 0.8rem;
      border-radius: 9px;
      border: 1.5px solid #c6d5e3;
      background: #ffffff;
      color: var(--ink);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .choice-btn::after {
      content: "Option";
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--foam);
      padding: 0.14rem 0.45rem;
      border-radius: 5px;
      margin-left: 0.5rem;
      flex-shrink: 0;
    }

    .choice-detail {
      display: none;
      background: var(--foam);
      border: 1px solid #c9dfec;
      border-left: 4px solid var(--sea);
      border-radius: 8px;
      padding: 0.82rem 0.92rem;
      font-size: 0.85rem;
      color: var(--ink);
    }

    .choice-detail ul {
      padding-left: 1.15rem;
      margin-top: 0.35rem;
    }

    .choice-detail li {
      margin-bottom: 0.28rem;
    }

    /* Active button styling for all 14 3-option slots */
    #s1-1:checked ~ .choice-stack label[for="s1-1"],
    #s1-2:checked ~ .choice-stack label[for="s1-2"],
    #s1-3:checked ~ .choice-stack label[for="s1-3"],
    #s2a-1:checked ~ .choice-stack label[for="s2a-1"],
    #s2a-2:checked ~ .choice-stack label[for="s2a-2"],
    #s2a-3:checked ~ .choice-stack label[for="s2a-3"],
    #s2b-1:checked ~ .choice-stack label[for="s2b-1"],
    #s2b-2:checked ~ .choice-stack label[for="s2b-2"],
    #s2b-3:checked ~ .choice-stack label[for="s2b-3"],
    #s2c-1:checked ~ .choice-stack label[for="s2c-1"],
    #s2c-2:checked
